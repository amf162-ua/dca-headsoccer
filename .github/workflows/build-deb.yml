name: Build & Release Debian (.deb)

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: write

jobs:
  build-and-package:
    runs-on: ubuntu-24.04

    steps:
      - name: Descargar código
        uses: actions/checkout@v4

      - name: Instalar dependencias de compilación y empaquetado
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential cmake ninja-build git debhelper fakeroot dpkg-dev \
            libgl1-mesa-dev libx11-dev libxrandr-dev libxinerama-dev \
            libxcursor-dev libxi-dev libasound2-dev

      - name: Compilar y ejecutar tests (CTest)
        run: |
          cmake -B build -G Ninja -DENABLE_TESTS=ON
          ninja -C build
          ctest --test-dir build --output-on-failure

      - name: Generar paquete .deb
        run: |
          dpkg-buildpackage -us -uc -b

      - name: Probar instalación del .deb con apt
        run: |
          mkdir -p dist
          mv ../headsoccer_*.deb dist/
          sudo apt-get install -y ./dist/headsoccer_*.deb
          which game
          ldd /usr/bin/game

      - name: Subir .deb como artefacto descargable
        uses: actions/upload-artifact@v4
        with:
          name: headsoccer-deb-ubuntu-24.04
          path: dist/headsoccer_*.deb

      - name: Leer versión desde debian/changelog
        id: version
        if: github.ref == 'refs/heads/main'
        run: |
          FULL_VER=$(dpkg-parsechangelog -S Version)
          UPSTREAM_VER=${FULL_VER%-*}
          echo "tag=v${UPSTREAM_VER}" >> "$GITHUB_OUTPUT"
          echo "deb_ver=${UPSTREAM_VER}" >> "$GITHUB_OUTPUT"

      - name: Crear o actualizar GitHub Release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: "Head Soccer Clash ${{ steps.version.outputs.deb_ver }}"
          generate_release_notes: true
          overwrite: true
          files: dist/headsoccer_*.deb
