name: Build desktop launcher

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: desktop-launcher-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Prepare desktop launcher artifact
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          install -m 644 \
            packaging/debian/usr/share/applications/head-soccer-clash.desktop \
            dist/head-soccer-clash.desktop
          install -m 644 \
            packaging/debian/usr/share/icons/hicolor/scalable/apps/head-soccer-clash.svg \
            dist/head-soccer-clash.svg
          grep -Fxq 'Type=Application' dist/head-soccer-clash.desktop
          grep -Fxq 'Exec=game' dist/head-soccer-clash.desktop
          grep -Fxq 'Icon=head-soccer-clash' dist/head-soccer-clash.desktop
          python3 -c 'import xml.etree.ElementTree as ET; ET.parse("dist/head-soccer-clash.svg")'

      - name: Upload desktop launcher
        uses: actions/upload-artifact@v4
        with:
          name: head-soccer-clash-desktop-${{ github.sha }}
          path: |
            dist/head-soccer-clash.desktop
            dist/head-soccer-clash.svg
          if-no-files-found: error
          retention-days: 30
