<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Fondo Azul Electrico y Profundo estilo Arcade -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e3a8a" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>

    <!-- Gradiente Neon Cicano para Anillo -->
    <linearGradient id="neonRing" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>

    <!-- Piel del personaje -->
    <linearGradient id="skinGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fde047" />
      <stop offset="100%" stop-color="#f97316" />
    </linearGradient>

    <!-- Casco / Gorra Deportiva con Estilo Fuego -->
    <linearGradient id="capGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ef4444" />
      <stop offset="100%" stop-color="#dc2626" />
    </linearGradient>

    <!-- Balon Metalico / Brillante -->
    <linearGradient id="ballGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#94a3b8" />
    </linearGradient>

    <!-- Filtro de Sombra y Brillo Neon -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#38bdf8" flood-opacity="0.6" />
    </filter>

    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="10" stdDeviation="15" flood-color="#000000" flood-opacity="0.5" />
    </filter>
  </defs>

  <!-- Fondo Circular con Sombra -->
  <circle cx="256" cy="256" r="230" fill="url(#bgGrad)" filter="url(#shadow)" />

  <!-- Anillo Exterior Neon Deportivo -->
  <circle cx="256" cy="256" r="210" fill="none" stroke="url(#neonRing)" stroke-width="10" opacity="0.8" />
  <circle cx="256" cy="256" r="195" fill="none" stroke="#ffffff" stroke-width="2" stroke-dasharray="12 8" opacity="0.4" />

  <!-- EFECTOS DE MOVIMIENTO -->
  <g opacity="0.3" stroke="#38bdf8" stroke-width="4" stroke-linecap="round">
    <line x1="280" y1="270" x2="350" y2="250" />
    <line x1="300" y1="300" x2="380" y2="290" />
    <line x1="270" y1="330" x2="340" y2="350" />
  </g>

  <!-- PERSONAJE -->

  <path d="M 170 430 Q 256 360 342 430 L 370 480 Q 256 510 142 480 Z" fill="#0284c7" />
  <path d="M 170 430 Q 256 360 342 430 L 320 480 Q 256 495 192 480 Z" fill="#0369a1" />
  <polygon points="220,390 256,435 292,390 256,410" fill="#facc15" />

  <circle cx="256" cy="225" r="135" fill="url(#skinGrad)" filter="url(#glow)" />

  <path d="M 130 210 Q 140 130 210 115 Z" fill="#0f172a" />
  <path d="M 382 210 Q 372 130 302 115 Z" fill="#0f172a" />

  <path d="M 125 180 C 125 100, 387 100, 387 180 Z" fill="url(#capGrad)" />
  <path d="M 345 155 Q 430 165 420 185 Q 410 200 335 175 Z" fill="#991b1b" />
  <circle cx="256" cy="135" r="16" fill="#facc15" />
  <text x="256" y="141" font-size="16" font-weight="bold" fill="#0f172a" text-anchor="middle">HS</text>

  <g transform="translate(0, 10)">
    <path d="M 175 195 L 235 185 Q 245 205 225 215 Z" fill="#0f172a" />
    <path d="M 277 185 L 337 195 Q 287 215 267 205 Z" fill="#0f172a" />
    <circle cx="218" cy="197" r="5" fill="#38bdf8" />
    <circle cx="294" cy="197" r="5" fill="#38bdf8" />
  </g>

  <path d="M 180 175 L 235 190" stroke="#78350f" stroke-width="7" stroke-linecap="round" />
  <path d="M 332 175 L 277 190" stroke="#78350f" stroke-width="7" stroke-linecap="round" />

  <path d="M 215 280 Q 256 315 297 280" fill="none" stroke="#0f172a" stroke-width="8" stroke-linecap="round" />

  <circle cx="170" cy="245" r="16" fill="#f43f5e" opacity="0.5" />
  <circle cx="342" cy="245" r="16" fill="#f43f5e" opacity="0.5" />


  <!-- BALON EN ACCION -->
  <g transform="translate(340, 310) scale(0.7)" filter="url(#shadow)">
    <circle cx="0" cy="0" r="75" fill="url(#ballGrad)" stroke="#0f172a" stroke-width="6" />
    <polygon points="0,-24 21,-12 21,12 0,24 -21,12 -21,-12" fill="#0f172a" />
    <line x1="0" y1="-24" x2="0" y2="-70" stroke="#0f172a" stroke-width="6" />
    <line x1="21" y1="-12" x2="60" y2="-38" stroke="#0f172a" stroke-width="6" />
    <line x1="21" y1="12" x2="55" y2="50" stroke="#0f172a" stroke-width="6" />
    <line x1="0" y1="24" x2="0" y2="70" stroke="#0f172a" stroke-width="6" />
    <line x1="-21" y1="12" x2="-55" y2="50" stroke="#0f172a" stroke-width="6" />
    <line x1="-21" y1="-12" x2="-60" y2="-38" stroke="#0f172a" stroke-width="6" />
    <circle cx="-30" cy="-30" r="12" fill="#ffffff" opacity="0.6" />
  </g>

</svg>